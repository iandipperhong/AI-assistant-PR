# main 브랜치에 코드가 올라가면: 테스트 → EC2 서버로 복사 → 설치 → 봇 재시작
# 필요한 Secrets 는 README 의 "자동 배포" 절을 보세요.
name: 서버에 자동 배포

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 "Run workflow" 버튼으로 수동 배포

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  APP_DIR: /home/ubuntu/AI-assistant-PR

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # 서버(Ubuntu 24.04)와 같은 버전
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Secrets 확인
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALLOWED_USER_IDS: ${{ secrets.ALLOWED_USER_IDS }}
        run: |
          missing=0
          for name in EC2_HOST EC2_SSH_KEY DISCORD_BOT_TOKEN GEMINI_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret '$name' 이 등록되지 않았습니다. README 의 '자동 배포' 절을 보세요."
              missing=1
            fi
          done
          if [ -z "$ALLOWED_USER_IDS" ]; then
            echo "::warning::ALLOWED_USER_IDS 가 비어 있어 누구나 봇을 쓸 수 있습니다. /whoami 로 ID 를 확인해 등록하세요."
          fi
          exit $missing

      - name: SSH 접속 준비
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # 윈도우에서 복사하면 줄바꿈에 \r 이 섞일 수 있어 지웁니다
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          host="$(echo "$EC2_HOST" | tr -d '[:space:]')"
          if ! ssh-keyscan -T 20 "$host" >> ~/.ssh/known_hosts 2>/dev/null || [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::서버($host)의 22번 포트에 접속할 수 없습니다. AWS 보안 그룹에서 SSH(22)를 0.0.0.0/0 으로 열었는지, 서버가 켜져 있는지, IP 가 바뀌지 않았는지 확인하세요."
            exit 1
          fi
          cat >> ~/.ssh/config <<EOF
          Host ec2
            HostName $host
            User ubuntu
            IdentityFile ~/.ssh/ec2.pem
            IdentitiesOnly yes
            ConnectTimeout 20
            ServerAliveInterval 30
          EOF
          ssh ec2 'echo "접속 성공: $(hostname)"'

      - name: 서버 기본 패키지 설치 (처음 한 번만 오래 걸려요)
        run: |
          ssh ec2 'if ! command -v rsync >/dev/null || ! dpkg -s python3-venv >/dev/null 2>&1; then
            sudo apt-get update -y &&
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y python3-venv python3-pip rsync curl
          fi'

      - name: 코드 복사
        run: |
          ssh ec2 "mkdir -p $APP_DIR"
          rsync -az --delete \
            --exclude .git --exclude .venv --exclude .env --exclude data \
            --exclude __pycache__ --exclude .pytest_cache \
            ./ "ec2:$APP_DIR/"

      - name: .env 만들기 (GitHub Secrets → 서버)
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALLOWED_USER_IDS: ${{ secrets.ALLOWED_USER_IDS }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: |
          umask 077
          {
            printf 'DISCORD_BOT_TOKEN=%s\n' "$DISCORD_BOT_TOKEN"
            printf 'DISCORD_GUILD_ID=%s\n' "$DISCORD_GUILD_ID"
            printf 'ALLOWED_USER_IDS=%s\n' "$ALLOWED_USER_IDS"
            printf 'LLM_PROVIDER=gemini\n'
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY"
            # DB 는 코드 폴더 밖에 두어 배포할 때 지워지지 않게 합니다
            printf 'DATABASE_URL=sqlite:////home/ubuntu/uos-assistant-data/assistant.db\n'
            printf 'TIMEZONE=Asia/Seoul\n'
          } | tr -d '\r' > env.deploy
          scp -q env.deploy "ec2:$APP_DIR/.env"
          rm -f env.deploy

      - name: 설치하고 봇 재시작
        run: ssh ec2 "APP_DIR=$APP_DIR bash $APP_DIR/deploy/server_setup.sh"

      - name: 정리
        if: always()
        run: rm -f ~/.ssh/ec2.pem
